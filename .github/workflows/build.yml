name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test core
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectCoreTests \
            test

      - name: Test language quality corpus
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectQualityTests \
            test

      - name: Test settings
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectSettingsTests \
            test

      - name: Test provider endpoint policy
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleEndpointPolicyTests \
            test

      - name: Test provider presets
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testGeminiPresetUsesGoogleOpenAICompatibilityEndpoint \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testOpenRouterPresetUsesSameOpenAICompatibleShape \
            test

      - name: Test provider request format
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testRequestUsesBearerKeyAndStructuredBody \
            test

      - name: Test provider response decoding
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testCorrectionDecodesStructuredResponse \
            test

      - name: Test provider auth guard
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testMissingAPIKeyFailsBeforeNetworkRequest \
            test

      - name: Test provider error privacy
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testHTTPFailureDoesNotIncludePromptInError \
            test

      - name: Test provider context bounds
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/CorrectionRequestTests \
            test

      - name: Test keychain sharing paths
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/SharedKeychainAccessGroupTests \
            -only-testing:AutocorrectProvidersTests/LegacyKeychainAccessTests \
            test

      - name: Build community release package
        run: zsh scripts/package-release.sh --unsigned

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(awk -F'\"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify single-app release layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="dist/Autocorrect-$VERSION-macOS.zip"
          test -f "$ZIP"
          ENTRIES="$(unzip -Z1 "$ZIP")"
          printf '%s\n' "$ENTRIES" | grep -Fq "Autocorrect.app/Contents/MacOS/Autocorrect"
          printf '%s\n' "$ENTRIES" | grep -Fq "Autocorrect.app/Contents/Resources/InputMethod/Autocorrect.app/"
          TOP_LEVEL="$(printf '%s\n' "$ENTRIES" | awk -F/ 'NF > 1 {print $1}' | sort -u)"
          test "$TOP_LEVEL" = "Autocorrect.app"

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autocorrect-${{ steps.version.outputs.version }}-macOS
          path: dist/Autocorrect-${{ steps.version.outputs.version }}-macOS.zip
          if-no-files-found: error

  publish-community-release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested macOS package
        uses: actions/download-artifact@v4
        with:
          name: Autocorrect-${{ needs.build-and-test.outputs.version }}-macOS
          path: dist

      - name: Auto-tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            "dist/Autocorrect-$VERSION-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Autocorrect $VERSION" \
            --notes "Single-app macOS community build. Drag Autocorrect.app to Applications, open it once, and it installs its embedded input method for the current user. This build is ad-hoc signed rather than Developer ID notarized, so macOS may require Open Anyway on first launch."
