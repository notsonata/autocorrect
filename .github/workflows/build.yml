name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test core
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectCoreTests \
            test

      - name: Test language quality corpus
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectQualityTests \
            test

      - name: Test settings
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectSettingsTests \
            test

      - name: Test provider endpoint policy
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleEndpointPolicyTests \
            test

      - name: Test provider presets
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testGeminiPresetUsesGoogleOpenAICompatibilityEndpoint \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testOpenRouterPresetUsesSameOpenAICompatibleShape \
            test

      - name: Test provider request format
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testRequestUsesBearerKeyAndStructuredBody \
            test

      - name: Test provider response decoding
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testCorrectionDecodesStructuredResponse \
            test

      - name: Test provider auth guard
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testMissingAPIKeyFailsBeforeNetworkRequest \
            test

      - name: Test provider error privacy
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testHTTPFailureDoesNotIncludePromptInError \
            test

      - name: Test provider context bounds
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/CorrectionRequestTests \
            test

      - name: Test shared keychain group resolution
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/SharedKeychainAccessGroupTests \
            test

      - name: Build unsigned release package
        run: zsh scripts/package-release.sh --unsigned

      - name: Verify release package layout
        run: |
          test -f dist/Autocorrect-0.1.0-macOS.zip
          test -f dist/Autocorrect-0.1.0-macOS.zip.sha256
          unzip -l dist/Autocorrect-0.1.0-macOS.zip | grep -F "Autocorrect-0.1.0/Install Autocorrect.app/"
          unzip -l dist/Autocorrect-0.1.0-macOS.zip | grep -F "Autocorrect-0.1.0/Autocorrect.app/"
          unzip -l dist/Autocorrect-0.1.0-macOS.zip | grep -F "Autocorrect-0.1.0/Autocorrect Settings.app/"
