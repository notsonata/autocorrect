name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test core
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectCoreTests \
            test

      - name: Test language quality corpus
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectQualityTests \
            test

      - name: Test settings
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectSettingsTests \
            test

      - name: Test provider endpoint policy
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleEndpointPolicyTests \
            test

      - name: Test provider presets
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testGeminiPresetUsesGoogleOpenAICompatibilityEndpoint \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testOpenRouterPresetUsesSameOpenAICompatibleShape \
            test

      - name: Test provider request format
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testRequestUsesBearerKeyAndStructuredBody \
            test

      - name: Test provider response decoding
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testCorrectionDecodesStructuredResponse \
            test

      - name: Test provider auth guard
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testMissingAPIKeyFailsBeforeNetworkRequest \
            test

      - name: Test provider error privacy
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/OpenAICompatibleCorrectionProviderTests/testHTTPFailureDoesNotIncludePromptInError \
            test

      - name: Test provider context bounds
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/CorrectionRequestTests \
            test

      - name: Test shared keychain group resolution
        run: |
          xcodebuild \
            -project Autocorrect.xcodeproj \
            -scheme AutocorrectInputMethod \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutocorrectProvidersTests/SharedKeychainAccessGroupTests \
            -only-testing:AutocorrectProvidersTests/LegacyKeychainAccessTests \
            test

      - name: Build unsigned release package
        run: zsh scripts/package-release.sh --unsigned

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(awk -F'\"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release package layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/Autocorrect-$VERSION-macOS.zip"
          test -f "dist/Autocorrect-$VERSION-macOS.zip.sha256"
          unzip -l "dist/Autocorrect-$VERSION-macOS.zip" | grep -F "Autocorrect-$VERSION/Install Autocorrect.app/"
          unzip -l "dist/Autocorrect-$VERSION-macOS.zip" | grep -F "Autocorrect-$VERSION/Autocorrect.app/"
          unzip -l "dist/Autocorrect-$VERSION-macOS.zip" | grep -F "Autocorrect-$VERSION/Autocorrect Settings.app/"

      - name: Upload unsigned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autocorrect-${{ steps.version.outputs.version }}-macOS-unsigned
          path: |
            dist/Autocorrect-${{ steps.version.outputs.version }}-macOS.zip
            dist/Autocorrect-${{ steps.version.outputs.version }}-macOS.zip.sha256
          if-no-files-found: error

      - name: Auto-tag and publish unsigned GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            "dist/Autocorrect-$VERSION-macOS.zip" \
            "dist/Autocorrect-$VERSION-macOS.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Autocorrect $VERSION" \
            --notes "Unsigned community build generated automatically from main. No paid Apple Developer account is required. macOS Gatekeeper may require manual approval before first launch."
