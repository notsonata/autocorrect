name: Autocorrect

options:
  bundleIdPrefix: dev.notsonata
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"

schemes:
  AutocorrectInputMethod:
    build:
      targets:
        AutocorrectCore: all
        AutocorrectProviders: all
        AutocorrectSettings: all
        AutocorrectInputMethod: all
        AutocorrectMenuBar: all
    test:
      targets:
        - AutocorrectCoreTests
        - AutocorrectProvidersTests
        - AutocorrectSettingsTests
        - AutocorrectQualityTests

targets:
  AutocorrectCore:
    type: framework
    platform: macOS
    sources:
      - Sources/AutocorrectCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.notsonata.autocorrect.core
        GENERATE_INFOPLIST_FILE: YES

  AutocorrectProviders:
    type: framework
    platform: macOS
    sources:
      - Sources/AutocorrectProviders
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.notsonata.autocorrect.providers
        GENERATE_INFOPLIST_FILE: YES

  AutocorrectSettings:
    type: framework
    platform: macOS
    sources:
      - Sources/AutocorrectSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.notsonata.autocorrect.settings.shared
        GENERATE_INFOPLIST_FILE: YES

  AutocorrectInputMethod:
    type: application
    platform: macOS
    sources:
      - path: Sources/AutocorrectInputMethod
        excludes:
          - Info.plist
          - AutocorrectInputMethod-Bridging-Header.h
    dependencies:
      - target: AutocorrectCore
      - target: AutocorrectProviders
      - target: AutocorrectSettings
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.notsonata.autocorrect.inputmethod
        PRODUCT_NAME: AutocorrectInputMethod
        INFOPLIST_FILE: Sources/AutocorrectInputMethod/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AutocorrectInputMethod/AutocorrectInputMethod-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Configuration/AutocorrectShared.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  AutocorrectMenuBar:
    type: application
    platform: macOS
    sources:
      - Sources/AutocorrectMenuBar
    dependencies:
      - target: AutocorrectProviders
      - target: AutocorrectSettings
      - target: AutocorrectInputMethod
        link: false
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: Embed Input Method
        script: |
          set -euo pipefail
          SOURCE="$BUILT_PRODUCTS_DIR/AutocorrectInputMethod.app"
          DESTINATION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/InputMethod/Autocorrect.app"
          test -d "$SOURCE"
          rm -rf "$DESTINATION"
          mkdir -p "$(dirname "$DESTINATION")"
          ditto "$SOURCE" "$DESTINATION"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/AutocorrectInputMethod.app"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/InputMethod/Autocorrect.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.notsonata.autocorrect
        PRODUCT_NAME: Autocorrect
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/AutocorrectShared.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  AutocorrectCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AutocorrectCoreTests
    dependencies:
      - target: AutocorrectCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AutocorrectProvidersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AutocorrectProvidersTests
    dependencies:
      - target: AutocorrectProviders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AutocorrectSettingsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AutocorrectSettingsTests
    dependencies:
      - target: AutocorrectSettings
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AutocorrectQualityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AutocorrectQualityTests
    dependencies:
      - target: AutocorrectCore
      - target: AutocorrectProviders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
